# Findings of the weekly image scan ('audit.yml') that are accepted for now.
#
# Only what cannot be fixed from here belongs in this file: the newest image
# of the vendor still contains the vulnerability. Accepted does not mean
# harmless. It means that nothing can be done but wait.
#
# Every entry names the file or package it applies to, what is affected and
# an expiry date. After that date the finding turns the run red again and is
# looked at anew. A new finding turns it red at once. An entry whose finding is
# gone is removed.
#
# A finding in a Go program names its file ('paths'). A system package has no
# file path, so such an entry names the package instead ('purls', without a
# version, for example 'pkg:apk/alpine/curl'). That keeps it to Alpine. The
# same vulnerability in a Debian package of our own image still turns the run
# red.
#
# Caddy 2.11.9 (5 November 2026) is the newest release and still contains
# golang.org/x/net 0.60.0. The fix is in 0.62.0, which the development branch
# of Caddy already requires. Only a new release of Caddy brings it, and
# 'caddy:2-alpine' follows it by itself.
vulnerabilities:
  - id: CVE-2026-78661
    paths: [usr/bin/caddy]
    statement: golang.org/x/net 0.60.0 in Caddy 2.11.9 (HTML parser), fixed in 0.62.0
    expired_at: 2026-11-30
