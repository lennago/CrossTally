# Searches the commits of a pull request for secrets (gitleaks).
#
# This is the net, not the gate. The repo is public, and when this check fires,
# the branch is already on GitHub. The gate is the pre-commit hook on the
# developer's machine. GitHub's push protection additionally stops the tokens
# of known providers at push time. What belongs here is whatever slips past
# both: a commit in the web editor, another machine, '--no-verify'.
#
# The binary instead of 'gitleaks-action'. The action requires a license key
# for organization accounts and in the end only calls the binary anyway.
# Version and checksum are pinned below. Dependabot does not see them, so bump
# them by hand (checksum from 'gitleaks_<version>_checksums.txt').
#
# A false positive (say, a password in a test) gets the marker
# '# gitleaks:allow' on its line. There is no '.gitleaksignore': the history
# starts afresh with the move into this repo.
name: Secrets

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  scan:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      # The whole history, otherwise the start of the range below is missing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${file}"
          echo "${GITLEAKS_SHA256}  ${file}" | sha256sum -c -
          tar xzf "${file}" gitleaks

      # Only the commits of the pull request. The rest has been checked already.
      - name: Scan pull request commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: ./gitleaks git . --log-opts="${BASE}..${HEAD}" --redact --no-banner -v
