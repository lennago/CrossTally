# Checks the counting app: format, tests, that it builds, and the way through
# it in a real Chromium.
#
# Triggered like the server: on a pull request on its own, on a push through
# 'image.yml'. No path filter, for the same reason as there.
name: App

on:
  pull_request:
    branches: [main]
  workflow_call:

# A fixed name of its own: as a building block of 'image.yml',
# 'github.workflow' would read "Image" here. Both blocks and the caller would
# share one group, and with 'cancel-in-progress' GitHub would abort the run as
# a deadlock.
concurrency:
  group: app-${{ github.ref }}
  # Not on 'main': there a cancelled run would take the release with it ('image.yml').
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# None of the steps needs more. The source is read, nothing is written. Without
# this the repo's permissions apply, and those are more generous than needed.
permissions:
  contents: read

env:
  NODE_VERSION: "26"
  # The same as in 'server_ci.yml': the end-to-end job starts a Django.
  UV_VERSION: "0.12.15"

jobs:
  check:
    name: Format, tests, build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./app

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      # With coverage: below the bars in 'vite.config.js' the run turns red.
      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

  # The way through the app in a real Chromium ('app/e2e/'). Vitest mounts the
  # interface in jsdom, which knows no service worker and no real layout. The
  # server behind the test is 'bin/e2e-server.sh': a Django with the demo
  # stock on SQLite. PostgreSQL is the server workflow's business.
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    # Build, demo and the specs take a few minutes. A run that hangs should
    # go red and show its log instead of blocking for six hours.
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ./app

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: server/uv.lock

      - name: Install dependencies
        run: npm ci

      # '--locked', like the server workflow: a forgotten 'uv lock' fails here
      # too. The script then runs 'uv run --frozen' and finds everything in place.
      - name: Install server dependencies
        working-directory: ./server
        run: uv sync --locked

      # The browser and the system libraries it needs. Only Chromium: the app
      # is built for phones, and Android means Chromium.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      # Traces and screenshots of the failed tests, and the report. Without
      # them a red run only says which step broke, not what the page showed.
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            app/playwright-report/
            app/test-results/
          retention-days: 7
          if-no-files-found: ignore
