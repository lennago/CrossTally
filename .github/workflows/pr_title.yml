# Checks the title of a pull request.
#
# Merging happens as one commit (squash), and its message is the pull request's
# title. From exactly these messages release-please reads the next version and
# the changelog. A title like "Reworked the import page" would vanish there
# without a trace.
#
# 'pull_request_target' instead of 'pull_request': only the title is checked.
# The pull request's code is neither checked out nor executed. That way the
# check also runs for pull requests from a fork without granting it anything.
name: PR title

on:
  pull_request_target:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  title:
    name: Conventional title
    runs-on: ubuntu-latest

    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The same types as in 'release-please-config.json'.
          types: |
            feat
            fix
            perf
            refactor
            revert
            docs
            style
            test
            build
            ci
            chore
          requireScope: false
