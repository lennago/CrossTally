# Checks the title of a pull request.
#
# Merging happens as one commit (squash), and its message is the pull request's
# title. From exactly these messages release-please reads the next version and
# the changelog. A title like "Reworked the import page" would vanish there
# without a trace.
#
# 'pull_request' like the other checks, not 'pull_request_target'. The release
# PR comes from a workflow with the 'GITHUB_TOKEN'. For it GitHub starts
# 'pull_request' runs only once someone approves them in the pull request, and
# 'pull_request_target' runs never (10/2026). The title is a required check,
# so the release PR could only be merged by bypassing the rules. Now it runs
# with the others after the approval. A pull request from a fork that needs an
# approval for its other checks needs it for this one too. The token stays
# read-only.
name: PR title

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  title:
    name: Conventional title
    runs-on: ubuntu-latest

    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The same types as in 'release-please-config.json'.
          types: |
            feat
            fix
            perf
            refactor
            revert
            docs
            style
            test
            build
            ci
            chore
          requireScope: false
